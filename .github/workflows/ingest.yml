name: jobfit ingest + match

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}     # manual "Run workflow" button in the Actions tab

jobs:
  ingest-and-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install supabase groq

      - name: Fetch + filter live boards -> Supabase `jobs`
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingest.py --config config.yaml

      - name: Score jobs against every user's resume -> Supabase `matches`
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # --scorer groq: free-tier semantic scoring (see README's "Better
        # scoring"). prefilter-top keeps this well under Groq's daily
        # request/token limits regardless of how many jobs/users this grows to.
        run: python match.py --scorer groq --config config.yaml --min-fit 0.35 --top 30 --prefilter-top 100
