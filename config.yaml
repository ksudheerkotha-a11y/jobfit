# Started curated for Customer Success/SaaS roles, then broadened (2026-07-26)
# so the app is useful for anyone who signs up, not just one job search.
# Verified live:
#   - postman:   9 Customer Success Engineer roles, including APAC-specific ones
#   - intercom:  12 Customer Success Manager / Account Manager roles
#   - twilio:    25 India-located roles (several Remote - India), plus
#                Technical Account Manager openings
#   - spotify:   includes an India-specific role (Agency Development Manager)
#   - stripe, airbnb, figma, vercel, datadog, discord, coinbase, databricks,
#     cloudflare, anthropic: large, diverse boards spanning engineering,
#     design, data, sales, marketing, finance, and more — not CS-specific
#   - airtable, amplitude, pendo, mixpanel, braze, klaviyo, iterable,
#     customerio, asana, outreach: SaaS companies with live CS/account-mgmt
#     openings worth watching
#
# The actual fit judgement (--scorer claude/groq) reads the resume and JD
# directly and doesn't depend on this being a complete skill taxonomy for
# every field — the `skills:` list below only feeds the free local
# pre-filter/fallback scorer, so it's deliberately broad rather than
# exhaustive per-domain.
#
# Added 2026-07-27: Ashby + RemoteOK, prioritizing remote roles.
#   - ramp, notion, linear, openai (Ashby): verified live, strong remote %
#     (linear is 100% remote-flagged; openai has 483 of 753 remote-flagged)
#     and genuine CS-titled roles (notion: 13, openai: 9, ramp: 4)
#   - substack (Ashby): smaller board, included for variety
#   - remoteok: a single global feed of remoteok.com's latest ~100 postings
#     across all companies — remote by definition, no per-company config
#
# Add more with:
#   greenhouse token = the slug in boards.greenhouse.io/<token>
#   lever slug       = the slug in jobs.lever.co/<slug>
#   ashby board      = the slug in jobs.ashbyhq.com/<board>
#   remoteok         = no token needed, one global feed
#
# Added 2026-07-30: pool expansion for new-user coverage — every token below
# was curl-verified live against its board API immediately before adding,
# with raw posting counts at verification time (before freshness/dedupe):
#   Greenhouse: dropbox (27), gitlab (187), robinhood (123), squarespace (16),
#     instacart (125), pinterest (202), elastic (221), mongodb (399),
#     webflow (23), samsara (311), brex (270), affirm (177), lyft (160),
#     monzo (70), duolingo (64)
#   Ashby: perplexity (86), clickup (65)
#   (Several other candidates — plaid, snowflake, confluent, hashicorp,
#   canva, doordash, zendesk, docusign, retool, notion via greenhouse,
#   and most tried Lever slugs — 404'd on their public board API and were
#   left out rather than added unverified.)
