# Started curated for Customer Success/SaaS roles, then broadened (2026-07-26)
# so the app is useful for anyone who signs up, not just one job search.
# Verified live:
#   - postman:   9 Customer Success Engineer roles, including APAC-specific ones
#   - intercom:  12 Customer Success Manager / Account Manager roles
#   - twilio:    25 India-located roles (several Remote - India), plus
#                Technical Account Manager openings
#   - spotify:   includes an India-specific role (Agency Development Manager)
#   - stripe, airbnb, figma, vercel, datadog, discord, coinbase, databricks,
#     cloudflare, anthropic: large, diverse boards spanning engineering,
#     design, data, sales, marketing, finance, and more — not CS-specific
#   - airtable, amplitude, pendo, mixpanel, braze, klaviyo, iterable,
#     customerio, asana, outreach: SaaS companies with live CS/account-mgmt
#     openings worth watching
#
# The actual fit judgement (--scorer claude/groq) reads the resume and JD
# directly and doesn't depend on this being a complete skill taxonomy for
# every field — the `skills:` list below only feeds the free local
# pre-filter/fallback scorer, so it's deliberately broad rather than
# exhaustive per-domain.
#
# Add more with:
#   greenhouse token = the slug in boards.greenhouse.io/<token>
#   lever slug       = the slug in jobs.lever.co/<slug>
companies:
  - type: greenhouse
    token: postman
