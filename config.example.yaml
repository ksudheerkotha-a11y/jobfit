# Curate 20-40 companies in your target space. Precision beats a huge list
# (remoteok below is the one exception — it's a single global feed, not a
# per-company board).
#
# Greenhouse token = the slug in boards.greenhouse.io/<token>
# Lever slug       = the slug in jobs.lever.co/<slug>
# Ashby board      = the slug in jobs.ashbyhq.com/<board>
# remoteok         = no token needed, one global feed of remote postings
companies:
  - type: greenhouse
    token: stripe
  - type: greenhouse
    token: airbnb
  - type: lever
    slug: netflix
  - type: lever
    slug: figma
  - type: ashby
    board: ramp
  - type: remoteok

# Curated skill vocabulary the local scorer checks resume/JD overlap against.
# Extend this with terms specific to your target roles.
skills:
  - python
  - javascript
  - typescript
  - react
  - node.js
  - sql
  - postgres
  - aws
  - gcp
  - azure
  - docker
  - kubernetes
  - ci/cd
  - rest api
  - graphql
  - machine learning
  - data pipeline
  - terraform
  - go
  - java
